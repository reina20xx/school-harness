<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Harness — Zero-Cost Academy Attendance, Parent LINE & AI Report Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <header class="border-b border-slate-800 bg-slate-900/70 backdrop-blur sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <span class="px-2.5 py-1 rounded-md bg-purple-600/20 border border-purple-500/40 text-purple-300 text-xs font-bold">SCHOOL HARNESS</span>
        <h1 class="text-lg font-bold">学習塾・スクール入退室LINE通知 ＆ AI指導レポート自動生成エンジン</h1>
      </div>
      <div class="text-xs text-sky-400 font-mono">Cloudflare Workers + D1 + MCP (¥0/mo)</div>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    <section class="lg:col-span-5 bg-slate-900 border border-slate-800 rounded-2xl p-6">
      <h2 class="text-lg font-bold mb-4">生徒QRチェックイン ＆ 授業キーワード記録</h2>
      <form id="lesForm" class="space-y-3">
        <div class="grid grid-cols-2 gap-2">
          <input id="student_name" required value="小林 陽葵" placeholder="生徒名" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
          <input id="parent_name" required value="小林 由美" placeholder="保護者名" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <input id="subject" required value="中学数学・プログラミング" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
          <input id="quiz_score" type="number" required value="94" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        </div>
        <input id="topic_covered" required value="二次関数のグラフ応用とPythonループ処理" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm" />
        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-2.5 rounded-lg text-sm">入室通知 ＆ 保護者LINE向けAI指導レポート生成</button>
      </form>
    </section>
    <section class="lg:col-span-7 bg-slate-900 border border-slate-800 rounded-2xl p-6">
      <h3 class="text-base font-bold mb-3">🎓 保護者LINE配信ログ（入退室 ＆ AI授業報告書）</h3>
      <div id="lesList" class="space-y-3 text-sm"></div>
    </section>
  </main>
  <script>
    async function load() {
      const data = await fetch('/api/dashboard').then(r => r.json());
      document.getElementById('lesList').innerHTML = data.logs.map(l => `
        <div class="p-4 rounded-xl bg-slate-950 border border-slate-800 space-y-2">
          <div class="flex justify-between"><span class="font-bold">${l.student_name}（保護者: ${l.parent_name}様）</span><span class="text-sky-400 font-bold">確認テスト: ${l.quiz_score}点</span></div>
          <div class="text-xs text-emerald-400">${l.checkin_notification}</div>
          <div class="text-xs bg-slate-900 p-3 rounded border border-purple-500/30 text-slate-200 whitespace-pre-wrap">${l.ai_parent_report}</div>
        </div>
      `).join('') || '<div class="text-xs text-slate-500">まだ指導記録がありません</div>';
    }
    document.getElementById('lesForm').addEventListener('submit', async e => {
      e.preventDefault();
      await fetch('/api/lessons/record', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          student_name: document.getElementById('student_name').value,
          parent_name: document.getElementById('parent_name').value,
          subject: document.getElementById('subject').value,
          quiz_score: Number(document.getElementById('quiz_score').value),
          topic_covered: document.getElementById('topic_covered').value,
        })
      });
      await load();
    });
    load();
  </script>
</body>
</html>
